<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<!--
  career-ops default resume template — "Classic ATS" layout.
  Modeled on the DE_Lydia_Liu_Milliman.docx structure (parsed 2026-05-21):
    - Name (bold) + single pipe-separated contact line
    - Bold UPPERCASE section headers with a thin bottom rule
    - OVERVIEW   : single summary paragraph
    - CORE SKILLS: categorized lines, "Category: items" (bold category label)
    - EXPERIENCE : per job -> "Title .......... Dates" row, "Company .......... Location" row, bullets
    - CERTIFICATION & EDUCATION: combined section

  HOW IT IS FILLED: generate-pdf.mjs does NOT parse the CV. The agent fills the
  {{TOKENS}} below from the active route's CV (cv.md / cv-de.md / cv-da.md / cv-pops.md),
  writes a temporary HTML, then runs `node generate-pdf.mjs <html> <pdf>`.

  EXPERIENCE block format (repeat per job):
    <div class="job">
      <div class="job-row"><span class="job-title">Title</span><span class="job-date">Dates</span></div>
      <div class="job-row"><span class="job-company">Company</span><span class="job-loc">Location</span></div>
      <ul><li>bullet</li> ...</ul>
    </div>

  SKILLS block format (repeat per category):
    <div class="skill-line"><span class="skill-cat">Category:</span> items</div>

  EDUCATION block format (combined certs + degrees):
    <div class="edu-line">Certs on one line</div>
    <div class="edu-row"><span><span class="edu-org">Institution</span> — Degree</span><span class="edu-meta">Location · Dates</span></div>
-->
<style>
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', Arial, Helvetica, sans-serif;
    font-size: 10.5px;
    line-height: 1.45;
    color: #000000;
    background: #ffffff;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 2px 0;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #000;
    letter-spacing: 0.01em;
    margin-bottom: 4px;
    line-height: 1.1;
  }

  .contact-row {
    font-size: 10px;
    color: #222;
  }

  .contact-row a {
    color: #222;
    text-decoration: none;
  }

  .contact-row .separator {
    color: #888;
    padding: 0 4px;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 13px;
  }

  .section-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #000;
    border-bottom: 1px solid #000;
    padding-bottom: 2px;
    margin-bottom: 7px;
  }

  /* === OVERVIEW === */
  .summary-text {
    font-size: 10.5px;
    line-height: 1.5;
    color: #000;
    text-align: justify;
  }

  /* === CORE SKILLS === */
  .skill-line {
    font-size: 10.5px;
    line-height: 1.55;
    color: #000;
    margin-bottom: 1px;
  }

  .skill-cat {
    font-weight: 700;
  }

  /* === EXPERIENCE === */
  .job {
    margin-bottom: 11px;
  }

  .job-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    line-height: 1.3;
  }

  .job-title {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .job-date {
    font-size: 10px;
    color: #000;
    white-space: nowrap;
  }

  .job-company {
    font-size: 10.5px;
    font-weight: 700;
    color: #000;
  }

  .job-loc {
    font-size: 10px;
    font-style: italic;
    color: #000;
    white-space: nowrap;
  }

  .job ul {
    padding-left: 16px;
    margin-top: 3px;
  }

  .job li {
    font-size: 10.5px;
    line-height: 1.45;
    color: #000;
    margin-bottom: 2px;
  }

  .job li strong {
    font-weight: 700;
  }

  /* === CERTIFICATION & EDUCATION === */
  .edu-line {
    font-size: 10.5px;
    color: #000;
    margin-bottom: 4px;
  }

  .edu-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    line-height: 1.4;
    margin-bottom: 2px;
  }

  .edu-org {
    font-weight: 700;
  }

  .edu-meta {
    font-size: 10px;
    font-style: italic;
    color: #000;
    white-space: nowrap;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page { padding: 0; }
  }

  /* === PAGE BREAK CONTROL === */
  .avoid-break,
  .job,
  .edu-row {
    break-inside: avoid;
    page-break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header avoid-break">
    <h1>{{NAME}}</h1>
    <div class="contact-row">{{CONTACT_LINE}}</div>
  </div>

  <!-- OVERVIEW -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- CORE SKILLS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    {{SKILLS}}
  </div>

  <!-- EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- CERTIFICATION & EDUCATION -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

</div>
</body>
</html>
